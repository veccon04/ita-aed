% ------------------- DISCRETIZAÇÃO ESPACIAL ------------------- %
% Nota: SPATIAL_ORDER_FLOW foi descontinuado nas versões recentes do SU2.
%
% 1. MÉTODOS UPWIND (HLLC, ROE):
%    - Ordem espacial controlada pela reconstrução MUSCL.
%    - 1ª Ordem: MUSCL_FLOW= NO
%    - 2ª Ordem: MUSCL_FLOW= YES
%    - Limitadores: SLOPE_LIMITER_FLOW= VENKATAKRISHNAN (ou NONE)
%    - Coef. Limitador: VENKAT_LIMITER_COEFF= 0.006
%
% 2. MÉTODOS CENTRAIS E HÍBRIDOS (JST, LAX-FRIEDRICH, CUSP):
%    - Ignoram as flags MUSCL_FLOW e SLOPE_LIMITER_FLOW.
%
%    - JST: Esquema central de 2ª ordem com dissipação artificial.
%      Parâmetro de controle: JST_SENSOR_COEFF= ( 0.5, 0.02 )
%
%    - LAX-FRIEDRICH: Esquema central com dissipação de 1ª ordem.
%      Extremamente estável e altamente dissipativo (ideal para inicializar
%      casos difíceis de convergir, porém de baixa precisão).
%      
%    - CUSP: Foi descontinuado/ nas versões mais recentes do SU2).
% -------------------------------------------------------------------------%
CONV_NUM_METHOD_FLOW= HLLC
MUSCL_FLOW= NO
% Slope limiter (VENKATAKRISHNAN, NONE)
